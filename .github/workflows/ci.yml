name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/AuditableOperations.Tests.Unit/AuditableOperations.Tests.Unit.csproj --no-build --configuration Release --verbosity normal

      - name: Integration tests
        run: dotnet test tests/AuditableOperations.Tests.Integration/AuditableOperations.Tests.Integration.csproj --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/AuditableOperations/AuditableOperations.csproj --no-build --configuration Release --output artifacts
